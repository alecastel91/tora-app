<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/tora_logo_square.png" />
    <!-- viewport-fit=cover makes iOS report real safe-area insets (rounded
         corners / home indicator); the tab bar and headers already pad with
         env(safe-area-inset-*) and were getting 0 without it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="TORA - Music Booking Platform" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="TORA" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>TORA - Music Booking</title>
  </head>
  <body>
    <!-- Paint dark in the FIRST frame — before any stylesheet arrives — so a
         standalone/PWA launch never flashes white. The boot mark is replaced
         the moment React mounts into #root. -->
    <style>
      html, body { background: #0a0a0a; margin: 0; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center;
              justify-content: center; background: #0a0a0a; z-index: 0; }
      #boot img { width: 128px; opacity: .9; }
      #root:not(:empty) + #boot { display: none; }
    </style>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="boot"><img src="/tora_logo_white.png" alt="" /></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
